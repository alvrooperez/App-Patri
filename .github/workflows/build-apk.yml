name: Build APK (PWABuilder)

# Plan B: usa PWABuilder (Microsoft) para generar el APK.
# Como PWABuilder no expone una API publica estable, este workflow:
#   1. Verifica que la webapp esta publicada en GitHub Pages
#   2. Crea un GitHub Issue con un link pre-rellenado a PWABuilder
#   3. Tu haces click -> descargas el APK -> se lo mandas a tu novia
#
# El cuerpo del issue esta en .github/ISSUE_TEMPLATE/apk-build.md
# con placeholders {{ORIGIN}}, {{PWA_URL}}, {{COMMIT}}, {{RUN_URL}}.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'mensajes.json'
      - '.github/workflows/build-apk.yml'
      - '.github/ISSUE_TEMPLATE/apk-build.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pages:
    name: Verify GitHub Pages is live
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.set.outputs.origin }}
      is_live: ${{ steps.check.outcome }}
    steps:
      - name: Set origin
        id: set
        run: |
          ORIGIN="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"
          echo "Origin: ${ORIGIN}"

      - name: Wait for Pages to propagate
        id: check
        run: |
          URL="${{ steps.set.outputs.origin }}/manifest.json"
          echo "Checking: $URL"
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Pages is live!"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Pages no responde, se generara el issue de todos modos"
          exit 1

  create-issue:
    name: Create APK build issue
    needs: check-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate URLs
        id: urls
        run: |
          ORIGIN="${{ needs.check-pages.outputs.origin }}"
          PWA_URL="https://www.pwabuilder.com/reportcard?site=${ORIGIN}"
          COMMIT="${{ github.event.head_commit.message }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "origin=${ORIGIN}"
            echo "pwa_url=${PWA_URL}"
            echo "commit=${COMMIT}"
            echo "run_url=${RUN_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "PWA URL: ${PWA_URL}"

      - name: Render issue body from template
        id: render
        run: |
          ORIGIN="${{ steps.urls.outputs.origin }}"
          PWA_URL="${{ steps.urls.outputs.pwa_url }}"
          COMMIT="${{ steps.urls.outputs.commit }}"
          RUN_URL="${{ steps.urls.outputs.run_url }}"

          # Reemplaza placeholders {{KEY}} por valores
          sed -e "s|{{ORIGIN}}|${ORIGIN}|g" \
              -e "s|{{PWA_URL}}|${PWA_URL}|g" \
              -e "s|{{COMMIT}}|${COMMIT}|g" \
              -e "s|{{RUN_URL}}|${RUN_URL}|g" \
              .github/ISSUE_TEMPLATE/apk-build.md > /tmp/issue-body.md

          echo "### Rendered body preview" >> "$GITHUB_STEP_SUMMARY"
          head -5 /tmp/issue-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cerrar issues viejos del mismo workflow
          OLD=$(gh issue list --label apk-build --state open --json number --jq '.[].number' || true)
          for n in $OLD; do
            echo "Closing old issue #$n"
            gh issue close "$n" --comment "Reemplazado por build nuevo" || true
          done

          gh issue create \
            --title ":package: APK lista para generar ($(date +%Y-%m-%d))" \
            --label apk-build \
            --body-file /tmp/issue-body.md

      - name: Summary
        run: |
          ORIGIN="${{ steps.urls.outputs.origin }}"
          PWA_URL="${{ steps.urls.outputs.pwa_url }}"
          {
            echo "### APK Build Issue Created"
            echo ""
            echo "Ve a la pestaña **Issues** del repo, hay un issue nuevo con"
            echo "el link directo a PWABuilder para generar la APK."
            echo ""
            echo "**PWABuilder URL:** $PWA_URL"
            echo "**Origen:** $ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"
