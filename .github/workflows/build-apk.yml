name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite compilar manualmente desde la pestaña Actions

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Descargar el codigo del repo
      - name: Checkout Code
        uses: actions/checkout@v5

      # 2. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias de Capacitor
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Usando package-lock.json para install reproducible"
            npm ci
          else
            echo "Sin lock file, usando npm install"
            npm install
          fi

      # 4. Copiar app-novia a dist/ (Capacitor necesita la webapp en dist/)
      #    En vez de Vite, usamos un build.js simple que copia HTML estatico
      - name: Build Web App
        run: node build.js

      # 5. Anadir plataforma Android (solo la primera vez, idempotente)
      - name: Capacitor Add Android
        run: |
          if [ ! -d "android" ]; then
            echo "Primera vez: anadiendo plataforma Android..."
            npx cap add android
          else
            echo "Plataforma Android ya existe, saltando cap add"
          fi

      # 6. Capacitor Sync (copia dist/ a android/app/src/main/assets/public/)
      - name: Capacitor Sync
        run: npx cap sync android

      # 7. Sanity check: verificar que el dist tiene los assets criticos
      - name: Verify dist contents
        run: |
          echo "=== Contenido de dist/ ==="
          ls -la dist/
          echo ""
          echo "=== Contenido de dist/assets/ ==="
          ls -la dist/assets/ 2>/dev/null || echo "NO HAY dist/assets/"
          echo ""
          echo "=== Contenido de dist/assets/pool/ ==="
          ls -la dist/assets/pool/ 2>/dev/null | head -20 || echo "NO HAY dist/assets/pool/"
          echo ""
          echo "=== Contenido de dist/assets/pool/_opt/ (debe tener 12 JPGs) ==="
          ls dist/assets/pool/_opt/*.jpg 2>/dev/null | wc -l
          ls dist/assets/pool/_opt/ 2>/dev/null | head -10 || echo "NO HAY dist/assets/pool/_opt/"
          echo ""
          echo "=== Existe dist/assets/pool/manifest.json? ==="
          if [ -f "dist/assets/pool/manifest.json" ]; then
            echo "OK, existe"
            head -20 dist/assets/pool/manifest.json
          else
            echo "::error::FALTA dist/assets/pool/manifest.json - la app no podra cargar fotos"
            exit 1
          fi
          echo ""
          echo "=== Existe dist/assets/icon/? ==="
          ls -la dist/assets/icon/

      # 8. Sobrescribir icono de la app con el nuestro (assets/icon/)
      - name: Override app icons
        run: |
          RES="android/app/src/main/res"
          # Mipmaps en diferentes densidades
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          # Usamos ImageMagick si esta disponible, sino Pillow via Python
          if command -v convert &> /dev/null; then
            echo "Usando ImageMagick"
            for SIZE_NAME in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              DENSITY="${SIZE_NAME%:*}"; SIZE="${SIZE_NAME#*:}";
              convert "dist/assets/icon/icon-512.png" -resize "${SIZE}x${SIZE}" \
                "$RES/mipmap-${DENSITY}/ic_launcher.png"
              convert "dist/assets/icon/icon-512.png" -resize "${SIZE}x${SIZE}" \
                "$RES/mipmap-${DENSITY}/ic_launcher_round.png"
            done
          elif command -v python3 &> /dev/null; then
            echo "Usando Pillow"
            python3 -c "
            from PIL import Image
            import os
            src = Image.open('dist/assets/icon/icon-512.png')
            sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
            for d, s in sizes.items():
                os.makedirs(f'android/app/src/main/res/mipmap-{d}', exist_ok=True)
                src.resize((s, s), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{d}/ic_launcher.png')
                src.resize((s, s), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{d}/ic_launcher_round.png')
            print('Iconos generados en todas las densidades')
            "
          else
            echo "::error::Ni ImageMagick ni Python3+Pillow disponibles, no puedo redimensionar el icono"
            exit 1
          fi
          # Forzar uso de nuestro icono (no el adaptive de Android 8+)
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" 2>/dev/null || true

      # 8. Sobrescribir el nombre de la app
      - name: Override app name
        run: |
          RES="android/app/src/main/res/values"
          mkdir -p "$RES"
          # Si Capacitor no creo strings.xml, lo creamos
          if [ ! -f "$RES/strings.xml" ]; then
            echo "<resources><string name=\"app_name\">Mi Dia a Dia</string></resources>" > "$RES/strings.xml"
          else
            # Reemplazar app_name (cuidado con sed en Windows-like paths, usamos perl)
            perl -i -pe 's|<string name="app_name">[^<]*</string>|<string name="app_name">Mi Dia a Dia</string>|' "$RES/strings.xml"
          fi
          cat "$RES/strings.xml"

      # 9. Configurar Java JDK 21 (requerido por Android Gradle moderno)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 8. Permisos de ejecucion al gradlew
      - name: Grant Execute Permission to Gradlew (10)
        run: chmod +x android/gradlew

      # 9. Compilar el APK debug con Gradle
      - name: Build APK with Gradle (11)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 10. Subir el APK como artefacto descargable
      - name: Upload APK Artifact (12)
        uses: actions/upload-artifact@v4
        with:
          name: mi-dia-a-dia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Resumen con instrucciones
      - name: Summary (13)
        if: success()
        run: |
          echo "### :tada: APK construida con exito!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Descarga el artefacto **mi-dia-a-dia-apk** de arriba" >> "$GITHUB_STEP_SUMMARY"
          echo "y mandaselo a tu novia por WhatsApp / Telegram." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ella abre el APK en su Android, acepta" >> "$GITHUB_STEP_SUMMARY"
          echo "'Instalar de fuente desconocida' y listo." >> "$GITHUB_STEP_SUMMARY"
