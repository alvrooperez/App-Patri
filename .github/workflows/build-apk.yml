name: Build APK (PWABuilder)

# Plan B: usa PWABuilder (Microsoft) para generar el APK.
# Como PWABuilder no expone una API publica estable, este workflow:
#   1. Verifica que la webapp esta publicada en GitHub Pages
#   2. Crea un GitHub Issue con un link pre-rellenado a PWABuilder
#   3. Tu haces click -> descargas el APK -> se lo mandas a tu novia
#
# Mas fiable que Bubblewrap (que es problematico en CI) y sigue
# siendo 99% automatico. Lo unico manual es el click en PWABuilder
# (porque Microsoft no expone una API publica estable).
#
# ALTERNATIVA: si quieres 100% automatico, te explico al final como
# instalar Bubblewrap en tu PC local y buildear ahi.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'assets/**'
      - 'mensajes.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pages:
    name: Verify GitHub Pages is live
    runs-on: ubuntu-latest
    outputs:
      is_live: ${{ steps.check.outcome }}
    steps:
      - name: Wait for Pages to propagate
        id: check
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json"
          echo "Checking: $URL"
          # GitHub Pages puede tardar 1-2 min en propagar tras un push
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Pages is live!"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Pages no responde todavia, se generara el issue de todos modos"
          exit 1

  create-issue:
    name: Create APK build issue
    needs: check-pages
    runs-on: ubuntu-latest
    steps:
      - name: Generate PWABuilder URL
        id: url
        run: |
          ORIGIN="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          PWA_URL="https://www.pwabuilder.com/reportcard?site=${ORIGIN}"
          echo "PWABuilder URL: $PWA_URL"
          echo "pwa_url=${PWA_URL}" >> "$GITHUB_OUTPUT"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"

      - name: Create issue with download instructions
        uses: actions/github-script@v7
        with:
          script: |
            const pwaUrl = '${{ steps.url.outputs.pwa_url }}';
            const origin = '${{ steps.url.outputs.origin }}';
            const commit = context.payload.head_commit?.message || 'manual';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Cerrar issues viejos del mismo workflow
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'apk-build'
            });
            for (const i of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: i.number,
                state: 'closed'
              });
            }

            const body = `## APK lista para generar

Tu webapp esta publicada en: **${origin}**

Ultimo commit: \`${commit}\`

### Pasos (2 minutos)

1. **Abre PWABuilder** con la URL ya rellenada:
   ${pwaUrl}

2. Click **"Package for stores"** -> **"Android"**

3. Acepta los defaults. PWABuilder genera el APK en ~30 segundos.

4. Click **"Download"** -> guarda el \`.apk\`

5. **Manda el .apk a tu novia** por WhatsApp / Telegram / email

6. En su Android, abre el APK y acepta "Instalar de fuente desconocida"

### Si quieres build 100% automatico

Instala [Bubblewrap](https://github.com/GoogleChromeLabs/bubblewrap) en tu PC:
\`\`\`bash
npm install -g @bubblewrap/cli
bubblewrap init --manifest ${origin}/manifest.json
bubblewrap build
\`\`\`

Saldra un APK en \`app-release-signed.apk\` lista para distribuir.

---
_Workflow run: ${runUrl}_
`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `:package: APK lista para generar (${new Date().toISOString().split('T')[0]})`,
              body: body,
              labels: ['apk-build']
            });

      - name: Summary
        run: |
          echo "### APK Build Issue Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ve a la pestaña **Issues** del repo, hay un issue nuevo con" >> "$GITHUB_STEP_SUMMARY"
          echo "el link directo a PWABuilder para generar la APK." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PWABuilder URL: ${{ steps.url.outputs.pwa_url }}" >> "$GITHUB_STEP_SUMMARY"
